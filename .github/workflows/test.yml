name: Test and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y procps net-tools util-linux
        
    - name: Run tests
      run: ./scripts/test.sh
      
    - name: Build
      run: go build -v ./cmd/kern
      
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    - name: Build for multiple platforms
      run: |
        GOOS=linux GOARCH=amd64 go build -o kern-linux-amd64 ./cmd/kern
        GOOS=linux GOARCH=arm64 go build -o kern-linux-arm64 ./cmd/kern
        GOOS=darwin GOARCH=amd64 go build -o kern-darwin-amd64 ./cmd/kern
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          kern-linux-amd64
          kern-linux-arm64
          kern-darwin-amd64